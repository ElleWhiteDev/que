<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paul Houston Massage – Wait List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sparkles" id="sparkles" aria-hidden="true"></div>
  <div class="rainbow-bar flow"></div>

  <header>
    <h1 class="flow">Paul Houston Massage</h1>
    <p class="subtitle">Wait List</p>
    <button id="find-me-btn" class="find-me-btn" type="button">📍 Find me</button>
  </header>

  <dialog id="find-me" class="modal" aria-labelledby="find-me-title">
    <h2 id="find-me-title">Find me</h2>
    <p>Find me at <strong>Massage Envy</strong> in Hamburg or the <strong>Lexington Healing Arts Academy</strong>.</p>
    <p>Look to book with <strong>Paul Houston</strong>.</p>
    <form method="dialog">
      <button class="close-btn">Close</button>
    </form>
  </dialog>

  <main>
    <section class="card">
      <h2>Join the wait list</h2>
      <p id="join-wait" class="join-wait"></p>
      <form id="join-form">
        <input id="name-input" type="text" placeholder="Your name" aria-label="Your name" maxlength="60" autocomplete="name" required />
        <button type="submit">Add me</button>
      </form>
      <p id="message" class="message" role="status"></p>
    </section>

    <section class="card">
      <h2>Currently waiting <span id="count" class="count">0</span></h2>
      <ol id="waitlist" class="waitlist"></ol>
      <p id="empty" class="empty">No one is waiting right now 🌈</p>
      <p class="note">Wait times assume 15 minutes per massage.</p>
    </section>
  </main>

  <footer class="site-footer">
    Made by <a href="https://ellewhite.dev" target="_blank" rel="noopener">ellewhitedev</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
